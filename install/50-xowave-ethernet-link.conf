# XO-Wave's Ethernet straight to a XOXO Studio (no router): a link-local
# address (169.254.x.x), so XO-Wave finds the Studio's network MIDI over mDNS.
# On a network with a router it gets its DHCP address as well. DHCP never gives
# up, so on a bare cable the connection (and its link-local address) stays up.
# Same settings as XOXO Studio's 50-fm1-ethernet-link.conf.
[connection-xowave-ethernet-link]
match-device=type:ethernet
ipv4.link-local=3
ipv4.dhcp-timeout=2147483647
