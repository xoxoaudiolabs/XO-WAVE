# XO-Wave configuration. Installed to /etc/xowave.conf.
# After editing:  sudo systemctl restart xowave

# --- Main audio output (real-time, low latency) -----------------------------
# Pi 3 built-in 3.5 mm jack. Run `xowave --list-devices` to see other choices
# (USB interface, DAC HAT...). Older OS images call the jack card "ALSA"
# instead of "Headphones".
audio.device  = plughw:CARD=Headphones,DEV=0
audio.rate    = 48000
# Frames per period x number of periods = output buffer.
# The Pi's built-in 3.5 mm jack has a fixed 480-frame (10 ms) period, so
# 480 x 2 = 20 ms is the lowest it can go. A USB audio interface can do
# 128 x 3 (8 ms) or less.
audio.period  = 480
audio.periods = 2
audio.priority = 70

# --- Bluetooth audio output (plays at the same time as the jack) ------------
# MAC address of a paired Bluetooth speaker/headphones; empty = off.
# Pair with:  sudo xowave-bt pair AA:BB:CC:DD:EE:FF audio
# Bluetooth always adds roughly 150-250 ms of delay, so it suits listening,
# not tight playing.
bluetooth.audio =
# Extra buffer on the Bluetooth path (ms). Raise if Bluetooth stutters.
bluetooth.latency_ms = 150

# --- Bluetooth MIDI controllers ---------------------------------------------
# Space-separated MACs of BLE MIDI controllers to keep connected.
# Pair with:  sudo xowave-bt pair AA:BB:CC:DD:EE:FF midi
bluetooth.midi =

# --- XOXO Studio link (Ethernet) ---------------------------------------------
# A cable straight into a XOXO Studio (or the same network): XO-Wave finds it,
# joins its network MIDI (MIDI both ways) and sends its sound to the Studio's
# XO-WAVE channel. While linked the Studio is the audio out: the jack stays on
# as a monitor, Bluetooth pauses. Toggle it on the screen: SETTINGS > STUDIO.
link.enabled = on
link.studio  = auto        # auto = find it by mDNS, or a Studio's address
link.port    = 46030       # the Studio's XO-WAVE receiver (UDP)

# --- Web app -------------------------------------------------------------------
# Every control from a phone or computer on the same network:
# http://<hostname>.local (e.g. http://xo-wave.local). No password.
web.enabled = on
web.port    = 80

# --- Synth ---------------------------------------------------------------------
master.volume = 0.8        # 0..1 starting master volume (the screen remembers changes)
synth.voices = 8           # 1-16; run `xowave --bench` to see CPU use
midi.channel = 0           # 0 = omni, 1-16 = single channel
presets.dir    = /opt/xowave/presets
wavetables.dir = /opt/xowave/wavetables   # drop Serum-style .wav wavetables here
preset.startup = 0         # index or preset name; MIDI program change switches

# --- Touchscreen -------------------------------------------------------------
ui.enabled = auto          # auto = use the 3.5" TFT if found, off = headless
ui.fb      = auto          # or e.g. /dev/fb1
ui.touch   = auto          # or e.g. /dev/input/event0
ui.fonts   = /opt/xowave/fonts
# Settings changed on the screen (MIDI channel, MIDI learn, buffer, voices,
# touch calibration, last preset) are kept here and override this file.
ui.state   = /var/lib/xowave/state.conf
# The current sound (including unsaved tweaks) is autosaved here and
# restored at power-on, so XO-Wave comes back exactly as you left it.
session.file = /var/lib/xowave/session.xowave

# --- MIDI CC map: cc.<number> = <parameter> ----------------------------------
# Parameter names: `xowave --list-params`. Fixed: CC1 mod wheel (vibrato),
# CC7 master volume, CC64 sustain, CC120/123 all notes off.
cc.74 = cutoff
cc.71 = resonance
cc.73 = amp_attack
cc.72 = amp_release
cc.20 = a_pos
cc.21 = b_pos
cc.22 = a_table
cc.23 = b_table
cc.24 = lfo_rate
cc.25 = lfo_pos
cc.26 = filter_env
cc.27 = menv_pos
cc.5  = glide
